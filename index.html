<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WheelerDealer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(15, 23, 42, 0.95);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 25px;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .hero {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero h1 {
      font-size: 4.5rem;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .hero p {
      font-size: 1.4rem;
      color: #cbd5e1;
    }

    .highlight {
      color: #38bdf8;
      font-weight: bold;
    }

    footer {
      padding: 25px 20px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(15, 23, 42, 0.95);
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }

      nav a {
        margin: 0 10px;
      }

      .hero h1 {
        font-size: 3rem;
      }

      .hero p {
        font-size: 1.1rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">WheelerDealer</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>WheelerDealer</h1>

      <p>
        <span class="highlight">Best in the Business</span>
      </p>
    </div>
  </section>

  <footer>
    <p>Contact Us</p>

    <p>
      +91 80937 59293 <br />
      +91 79788 37829
    </p>

    <p>
      © 2026 WheelerDealer. All rights reserved.
    </p>
  </footer>

</body>
</html>
