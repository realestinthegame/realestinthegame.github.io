<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WheelerDealer</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.4rem;
      color: #cbd5e1;
    }

    .highlight {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>WheelerDealer</h1>
    <p>
      <span class="highlight">Best in the Business</span>
    </p>
  </div>
</body>
</html>
